name: ResiliTwin AI quality checks
on:
  push:
    paths:
      - '06-applied-ai/resilitwin-ai/**'
      - '.github/workflows/resilitwin-ci.yml'
  pull_request:
    paths:
      - '06-applied-ai/resilitwin-ai/**'
      - '.github/workflows/resilitwin-ci.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e './06-applied-ai/resilitwin-ai[test]'
      - name: Run checks
        working-directory: 06-applied-ai/resilitwin-ai
        run: python -m pytest -q
