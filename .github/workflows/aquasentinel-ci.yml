name: AquaSentinel quality checks
on:
  push:
    paths:
      - '06-applied-ai/aquasentinel-ai/**'
  pull_request:
    paths:
      - '06-applied-ai/aquasentinel-ai/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e './06-applied-ai/aquasentinel-ai[dev]'
      - name: Run tests
        working-directory: 06-applied-ai/aquasentinel-ai
        run: python -m pytest
